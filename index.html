<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Browser extensions manager UI</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <nav>
      <img src="./assets/images/logo.svg" alt="logo">
      <button id="toggle-dark-mode">
        <img src="./assets/images/icon-moon.svg" alt="Toggle dark mode">
      </button>
    </nav>
    <nav>
      <h1>Extensions List</h1>
      <div class="filter-buttons">
        <button>All</button>
        <button>Active</button>
        <button>Inactive</button>
      </div>
    </nav>
    <section>
      <div class="extension-card">
        <div>
          <img src="./assets/images/logo-console-plus.svg" alt="DevLens">
          <div class="extension-info">
            <h2>DevLens</h2>
            <p>Quickly inspect page layouts and visualize element boundaries.</p>
          </div>
        </div>
        <div>
          <button class="toggle-button">Remove</button>
          <div id="toggle-switch" class="">
            <button id="switch-container">
              <div id="switch-ball"></div>
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- If you plan to use the JSON file to populate the data dynamically, you can delete the content below -->

  <!-- DevLens
  Quickly inspect page layouts and visualize element boundaries.
  Remove

  StyleSpy
  Instantly analyze and copy CSS from any webpage element.
  Remove

  Optimizes browser resource usage to accelerate page loading.
  Remove

  JSONWizard
  Formats, validates, and prettifies JSON responses in-browser.
  Remove

  TabMaster Pro
  Organizes browser tabs into groups and sessions.
  Remove

  ViewportBuddy
  Simulates various screen resolutions directly within the browser.
  Remove

  Markup Notes
  Enables annotation and notes directly onto webpages for collaborative debugging.
  Remove

  GridGuides
  Overlay customizable grids and alignment guides on any webpage.
  Remove

  Palette Picker
  Instantly extracts color palettes from any webpage.
  Remove

  LinkChecker
  Scans and highlights broken links on any page.
  Remove

  DOM Snapshot
  Capture and export DOM structures quickly.
  Remove

  ConsolePlus
  Enhanced developer console with advanced filtering and logging.
  Remove -->

  <script src="main.js"></script>
</body>

</html>
